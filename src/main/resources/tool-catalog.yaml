workflows:
  - id: pressure_recovery_path
    familyId: compressed_air_unit
    intent: Recover the pressure delivery path and verify service readiness
    queryOutcomes:
      - "Bring the affected delivery path to a %s operating state."
      - "Use the documented maintenance tool to complete the pressure recovery workflow and finish %s."
      - "Restore the affected service path and leave it %s."
    expectedFinalState:
      fault_status: identified
      pressure_path: stabilized
      service_state: ready
    steps:
      - role: diagnose
        verbSeeds: [diagnose, inspect]
        nounSeeds: [sensor, line]
        preconditionTemplate: {}
        effectTemplate: { fault_status: identified }
        optionProfile: profile_required
      - role: isolate
        verbSeeds: [isolate]
        nounSeeds: [valve, line]
        preconditionTemplate: { fault_status: identified }
        effectTemplate: { pressure_path: isolated }
        optionProfile: line_required
      - role: restore
        verbSeeds: [calibrate, restart]
        nounSeeds: [compressor, line]
        preconditionTemplate: { pressure_path: isolated }
        effectTemplate: { pressure_path: stabilized }
        optionProfile: path_required
      - role: verify
        verbSeeds: [verify, measure]
        nounSeeds: [service, compressor]
        preconditionTemplate: { pressure_path: stabilized }
        effectTemplate: { service_state: ready }
        optionProfile: confirm_required
  - id: calibration_readiness_path
