optionProfiles:
  - id: none
    style: NONE
    allowedFlags: []
    valueMode: NONE
  - id: confirm_required
    style: REQUIRED
    allowedFlags: [confirm, force]
    valueMode: NONE
  - id: line_required
    style: REQUIRED
    allowedFlags: [line, segment]
    valueMode: LETTER_SUFFIX
  - id: zone_required
    style: REQUIRED
    allowedFlags: [zone, channel]
    valueMode: NUMERIC_SUFFIX
  - id: profile_required
    style: REQUIRED
    allowedFlags: [profile, mode]
    valueMode: PROFILE_SUFFIX
  - id: path_required
    style: REQUIRED
    allowedFlags: [path, circuit]
    valueMode: PATH_SUFFIX
  - id: policy_required
    style: REQUIRED
    allowedFlags: [policy, rule]
    valueMode: PROFILE_SUFFIX

families:
