optionProfiles:
  - id: confirm_required
    style: REQUIRED
    allowedFlags: [confirm, force]
    valueMode: NONE
  - id: line_required
    style: REQUIRED
    allowedFlags: [line, segment]
    valueMode: LETTER_SUFFIX
  - id: zone_required
    style: REQUIRED
    allowedFlags: [zone, channel]
    valueMode: NUMERIC_SUFFIX
  - id: profile_required
    style: REQUIRED
    allowedFlags: [profile, mode]
    valueMode: PROFILE_SUFFIX
  - id: path_required
    style: REQUIRED
    allowedFlags: [path, circuit]
    valueMode: PATH_SUFFIX
  - id: policy_required
    style: REQUIRED
    allowedFlags: [policy, rule]
    valueMode: PROFILE_SUFFIX

families:
  - id: metal_pipe_generation
    domain: MANUFACTURING
    purpose: pipe forming, thermal handling, and joining support for metal production
    queryTemplates:
      - "Bring the affected pipe process to a %s condition using the documented tools."
      - "Recover the pipe production path so the final result is %s."
    tools:
      - id: welder
        purpose: material joining and seam readiness for pipe sections
        nameFragments: [arcunit, seamcore, joinbay]
        stateVariables: [torch_state, seam_state, weld_state]
        fillerCommandRoles: [inspect torch, align seam, verify joint]
        capabilities:
          - id: inspect_torch
            role: inspect
            verbSeeds: [inspect]
            nounSeeds: [torch, nozzle]
            preconditions:
              - scope: SHARED
                variable: profile_state
                value: stable
            effects:
              - scope: TOOL
                variable: torch_state
                value: inspected
            optionProfile: confirm_required
          - id: align_seam
            role: align
            verbSeeds: [align]
            nounSeeds: [seam, joint]
            preconditionTemplate: { torch_state: inspected }
            effectTemplate: { seam_state: aligned }
            optionProfile: zone_required
          - id: weld_joint
            role: weld
            verbSeeds: [weld]
            nounSeeds: [joint, pipe]
            preconditions:
              - scope: TOOL
                variable: seam_state
                value: aligned
              - scope: SHARED
                variable: profile_state
                value: stable
            effects:
              - scope: TOOL
                variable: weld_state
                value: joined
              - scope: SHARED
                variable: joint_state
                value: joined
            optionProfile: path_required
          - id: verify_weld
            role: verify
            verbSeeds: [verify]
            nounSeeds: [joint, seam]
            preconditionTemplate: { weld_state: joined }
            effectTemplate: { weld_state: verified }
            optionProfile: confirm_required
      - id: shape_maintainer
        purpose: profile stabilization and pipe geometry control
        nameFragments: [shapehub, profilex, formcell]
        stateVariables: [shape_state, profile_state, fixture_state]
        fillerCommandRoles: [inspect fixture, clamp profile, verify shape]
        capabilities:
          - id: clamp_pipe
            role: clamp
            verbSeeds: [clamp]
            nounSeeds: [fixture, pipe]
            preconditionTemplate: {}
            effectTemplate: { shape_state: clamped }
            optionProfile: zone_required
          - id: stabilize_profile
            role: stabilize
            verbSeeds: [align, calibrate]
            nounSeeds: [profile, fixture]
            preconditions:
              - scope: TOOL
                variable: shape_state
                value: clamped
            effects:
              - scope: TOOL
                variable: profile_state
                value: stable
              - scope: SHARED
                variable: profile_state
                value: stable
            optionProfile: profile_required
          - id: verify_shape
            role: verify
            verbSeeds: [verify]
            nounSeeds: [profile, shape]
            preconditions:
              - scope: TOOL
                variable: profile_state
                value: stable
              - scope: SHARED
                variable: joint_state
                value: joined
            effects:
              - scope: TOOL
                variable: shape_state
                value: verified
              - scope: SHARED
                variable: geometry_state
                value: verified
            optionProfile: confirm_required
      - id: cooler
        purpose: coolant flow and thermal reduction for hot pipe sections
        nameFragments: [coolflow, loopcell, thermpath]
        stateVariables: [coolant_state, cooling_state, loop_state]
        fillerCommandRoles: [inspect valve, synchronize loop, verify coolant]
        capabilities:
          - id: prime_loop
            role: prime
            verbSeeds: [inspect, synchronize]
            nounSeeds: [loop, valve]
            preconditions:
              - scope: SHARED
                variable: heat_state
                value: measured
            effects:
              - scope: TOOL
                variable: coolant_state
                value: primed
            optionProfile: line_required
          - id: cool_pipe
            role: cool
            verbSeeds: [restart, synchronize]
            nounSeeds: [loop, channel]
            preconditions:
              - scope: TOOL
                variable: coolant_state
                value: primed
            effects:
              - scope: TOOL
                variable: cooling_state
                value: active
              - scope: SHARED
                variable: cooling_state
                value: active
            optionProfile: path_required
          - id: verify_cooling
            role: verify
            verbSeeds: [verify]
            nounSeeds: [coolant, service]
            preconditions:
              - scope: TOOL
                variable: cooling_state
                value: active
              - scope: SHARED
                variable: temperature_state
                value: governed
            effects:
              - scope: TOOL
                variable: cooling_state
                value: verified
              - scope: SHARED
                variable: thermal_state
                value: verified
            optionProfile: confirm_required
      - id: temperature_controller
        purpose: heat measurement and temperature governance for forming lines
        nameFragments: [thermctl, heatcore, tempbay]
        stateVariables: [heat_state, temperature_state, controller_state]
        fillerCommandRoles: [inspect sensor, calibrate controller, verify heat]
        capabilities:
          - id: measure_heat
            role: measure
            verbSeeds: [measure, inspect]
            nounSeeds: [sensor, heat]
            effects:
              - scope: TOOL
                variable: heat_state
                value: measured
              - scope: SHARED
                variable: heat_state
                value: measured
            optionProfile: zone_required
          - id: govern_temperature
            role: govern
            verbSeeds: [calibrate, enable]
            nounSeeds: [controller, mode]
            preconditions:
              - scope: TOOL
                variable: heat_state
                value: measured
              - scope: SHARED
                variable: cooling_state
                value: active
            effects:
              - scope: TOOL
                variable: temperature_state
                value: governed
              - scope: SHARED
                variable: temperature_state
                value: governed
            optionProfile: profile_required
          - id: verify_temperature
            role: verify
            verbSeeds: [verify]
            nounSeeds: [sensor, service]
            preconditionTemplate: { temperature_state: governed }
            effectTemplate: { controller_state: verified }
            optionProfile: confirm_required
    workflows:
      - id: weld_shape_control
        intent: Weld the raw metal while preserving pipe geometry
        outcomePhrases: [joined and shape-stable, welded with verified geometry]
        steps:
          - toolId: shape_maintainer
            capabilityId: clamp_pipe
          - toolId: shape_maintainer
            capabilityId: stabilize_profile
          - toolId: welder
            capabilityId: inspect_torch
          - toolId: welder
            capabilityId: align_seam
          - toolId: welder
            capabilityId: weld_joint
          - toolId: shape_maintainer
            capabilityId: verify_shape
      - id: cool_temperature_governance
        intent: Cool the hot pipe section while governing temperature output
        outcomePhrases: [cooled under governed temperature, thermally stable and verified]
        steps:
          - toolId: temperature_controller
            capabilityId: measure_heat
          - toolId: cooler
            capabilityId: prime_loop
          - toolId: cooler
            capabilityId: cool_pipe
          - toolId: temperature_controller
            capabilityId: govern_temperature
          - toolId: cooler
            capabilityId: verify_cooling

  - id: assembly_finishing
    domain: MANUFACTURING
    purpose: fixture alignment, closure sealing, and finished assembly verification
    queryTemplates:
      - "Return the affected finishing workflow to a %s result using the documented tools."
      - "Complete the assembly finishing path so the final condition is %s."
    tools:
      - id: fixture_aligner
        purpose: fixture positioning and assembly alignment
        nameFragments: [alignbay, jigcore, fitline]
        stateVariables: [fixture_state, alignment_state, die_state]
        fillerCommandRoles: [inspect fixture, align jig, verify die]
        capabilities:
          - id: inspect_fixture
            role: inspect
            verbSeeds: [inspect]
            nounSeeds: [fixture, jig]
            preconditionTemplate: {}
            effectTemplate: { fixture_state: inspected }
            optionProfile: confirm_required
          - id: align_fixture
            role: align
            verbSeeds: [align, calibrate]
            nounSeeds: [fixture, jig]
            preconditions:
              - scope: TOOL
                variable: fixture_state
                value: inspected
            effects:
              - scope: TOOL
                variable: alignment_state
                value: aligned
              - scope: SHARED
                variable: alignment_state
                value: aligned
            optionProfile: zone_required
          - id: verify_alignment
            role: verify
            verbSeeds: [verify]
            nounSeeds: [fixture, assembly]
            preconditionTemplate: { alignment_state: aligned }
            effectTemplate: { die_state: verified }
            optionProfile: confirm_required
      - id: sealer
        purpose: closure sealing and containment preparation
        nameFragments: [sealbay, presslock, closurex]
        stateVariables: [seal_state, containment_state, press_state]
        fillerCommandRoles: [inspect mold, clamp closure, verify seal]
        capabilities:
          - id: prepare_press
            role: prepare
            verbSeeds: [inspect, clamp]
            nounSeeds: [press, mold]
            preconditions:
              - scope: SHARED
                variable: alignment_state
                value: aligned
            effects:
              - scope: TOOL
                variable: press_state
                value: ready
            optionProfile: profile_required
          - id: seal_closure
            role: seal
            verbSeeds: [seal, clamp]
            nounSeeds: [closure, assembly]
            preconditions:
              - scope: TOOL
                variable: press_state
                value: ready
            effects:
              - scope: TOOL
                variable: seal_state
                value: secured
              - scope: SHARED
                variable: closure_state
                value: sealed
            optionProfile: path_required
          - id: verify_containment
            role: verify
            verbSeeds: [verify]
            nounSeeds: [containment, batch]
            preconditions:
              - scope: TOOL
                variable: seal_state
                value: secured
            effects:
              - scope: TOOL
                variable: containment_state
                value: verified
              - scope: SHARED
                variable: containment_state
                value: verified
            optionProfile: confirm_required
      - id: quality_scanner
        purpose: batch scanning and final quality confirmation
        nameFragments: [scanline, qualbay, proofcell]
        stateVariables: [scan_state, quality_state, batch_state]
        fillerCommandRoles: [inspect batch, record quality, verify scanner]
        capabilities:
          - id: scan_batch
            role: scan
            verbSeeds: [inspect, measure]
            nounSeeds: [batch, assembly]
            preconditions:
              - scope: SHARED
                variable: alignment_state
                value: aligned
            effects:
              - scope: TOOL
                variable: scan_state
                value: complete
            optionProfile: line_required
          - id: record_quality
            role: record
            verbSeeds: [record, verify]
            nounSeeds: [quality, batch]
            preconditionTemplate: { scan_state: complete }
            effectTemplate: { quality_state: recorded }
            optionProfile: confirm_required
          - id: release_batch
            role: release
            verbSeeds: [verify]
            nounSeeds: [batch, assembly]
            preconditions:
              - scope: TOOL
                variable: quality_state
                value: recorded
            effects:
              - scope: TOOL
                variable: batch_state
                value: released
              - scope: SHARED
                variable: batch_state
                value: released
            optionProfile: confirm_required
    workflows:
      - id: seal_aligned_assembly
        intent: Seal an aligned assembly and verify containment
        outcomePhrases: [sealed with verified containment, aligned and containment-ready]
        steps:
          - toolId: fixture_aligner
            capabilityId: inspect_fixture
          - toolId: fixture_aligner
            capabilityId: align_fixture
          - toolId: sealer
            capabilityId: prepare_press
          - toolId: sealer
            capabilityId: seal_closure
          - toolId: sealer
            capabilityId: verify_containment
      - id: finish_quality_release
        intent: Align the assembly and release it after quality confirmation
        outcomePhrases: [quality-recorded and released, aligned with released batch status]
        steps:
          - toolId: fixture_aligner
            capabilityId: inspect_fixture
          - toolId: fixture_aligner
            capabilityId: align_fixture
          - toolId: quality_scanner
            capabilityId: scan_batch
          - toolId: quality_scanner
            capabilityId: record_quality
          - toolId: quality_scanner
            capabilityId: release_batch

  - id: wifi_setup
    domain: NETWORK_INFRA
    purpose: wireless setup, bandwidth correction, and connectivity verification
    queryTemplates:
      - "Restore the affected wireless setup to a %s result using the documented tools."
      - "Debug the wireless service path so the final condition is %s."
    tools:
      - id: router
        purpose: wireless route activation and radio service handling
        nameFragments: [routex, radiocore, meshline]
        stateVariables: [route_state, radio_state, service_state]
        fillerCommandRoles: [inspect router, configure radio, verify service]
        capabilities:
          - id: inspect_router
            role: inspect
            verbSeeds: [inspect]
            nounSeeds: [router, radio]
            preconditions:
              - scope: SHARED
                variable: wireless_profile_state
                value: ready
            effects:
              - scope: TOOL
                variable: route_state
                value: inspected
            optionProfile: line_required
          - id: activate_radio
            role: activate
            verbSeeds: [enable, configure]
            nounSeeds: [radio, router]
            preconditions:
              - scope: TOOL
                variable: route_state
                value: inspected
            effects:
              - scope: TOOL
                variable: radio_state
                value: active
              - scope: SHARED
                variable: radio_state
                value: active
            optionProfile: profile_required
          - id: refresh_route
            role: refresh
            verbSeeds: [configure, route]
            nounSeeds: [router, gateway]
            preconditionTemplate: { radio_state: active }
            effectTemplate: { service_state: routed }
            optionProfile: path_required
      - id: wiring
        purpose: physical link inspection and wiring path readiness
        nameFragments: [wirehub, linkbay, cablex]
        stateVariables: [link_state, port_state, wiring_state]
        fillerCommandRoles: [inspect port, trace cable, verify link]
        capabilities:
          - id: inspect_link
            role: inspect
            verbSeeds: [inspect, trace]
            nounSeeds: [port, link]
            preconditionTemplate: {}
            effectTemplate: { link_state: inspected }
            optionProfile: zone_required
          - id: repair_wiring
            role: repair
            verbSeeds: [configure, repair]
            nounSeeds: [port, cable]
            preconditions:
              - scope: TOOL
                variable: link_state
                value: inspected
            effects:
              - scope: TOOL
                variable: wiring_state
                value: repaired
              - scope: SHARED
                variable: link_path_state
                value: repaired
            optionProfile: path_required
          - id: verify_link
            role: verify
            verbSeeds: [verify]
            nounSeeds: [link, port]
            preconditionTemplate: { wiring_state: repaired }
            effectTemplate: { port_state: verified }
            optionProfile: confirm_required
      - id: config_setup
        purpose: wireless configuration and mode preparation
        nameFragments: [cfgmesh, modecore, setupx]
        stateVariables: [config_state, mode_state, profile_state]
        fillerCommandRoles: [inspect config, configure mode, verify profile]
        capabilities:
          - id: inspect_config
            role: inspect
            verbSeeds: [inspect]
            nounSeeds: [config, profile]
            preconditions:
              - scope: SHARED
                variable: link_path_state
                value: repaired
            effects:
              - scope: TOOL
                variable: config_state
                value: inspected
            optionProfile: policy_required
          - id: apply_config
            role: apply
            verbSeeds: [configure, setup]
            nounSeeds: [config, mode]
            preconditions:
              - scope: TOOL
                variable: config_state
                value: inspected
            effects:
              - scope: TOOL
                variable: mode_state
                value: applied
              - scope: SHARED
                variable: wireless_profile_state
                value: ready
            optionProfile: profile_required
          - id: verify_profile
            role: verify
            verbSeeds: [verify]
            nounSeeds: [profile, config]
            preconditionTemplate: { mode_state: applied }
            effectTemplate: { profile_state: verified }
            optionProfile: confirm_required
      - id: tester
        purpose: wireless signal and throughput verification
        nameFragments: [testmesh, signalx, probehub]
        stateVariables: [signal_state, throughput_state, client_state]
        fillerCommandRoles: [inspect signal, measure client, verify throughput]
        capabilities:
          - id: test_signal
            role: test
            verbSeeds: [inspect, measure]
            nounSeeds: [signal, client]
            effects:
              - scope: TOOL
                variable: signal_state
                value: tested
              - scope: SHARED
                variable: signal_state
                value: tested
            optionProfile: zone_required
          - id: verify_throughput
            role: verify
            verbSeeds: [verify, measure]
            nounSeeds: [throughput, service]
            preconditions:
              - scope: TOOL
                variable: signal_state
                value: tested
              - scope: SHARED
                variable: radio_state
                value: active
            effects:
              - scope: TOOL
                variable: throughput_state
                value: verified
              - scope: SHARED
                variable: throughput_state
                value: verified
            optionProfile: confirm_required
          - id: verify_connection
            role: verify
            verbSeeds: [verify]
            nounSeeds: [client, service]
            preconditions:
              - scope: TOOL
                variable: signal_state
                value: tested
              - scope: SHARED
                variable: radio_state
                value: active
            effects:
              - scope: TOOL
                variable: client_state
                value: connected
              - scope: SHARED
                variable: connectivity_state
                value: verified
            optionProfile: confirm_required
      - id: bandwidth_setter
        purpose: bandwidth profile adjustment and rate control
        nameFragments: [bandctl, ratecore, widthx]
        stateVariables: [bandwidth_state, rate_state, policy_state]
        fillerCommandRoles: [inspect policy, configure rate, verify bandwidth]
        capabilities:
          - id: inspect_bandwidth
            role: inspect
            verbSeeds: [inspect, measure]
            nounSeeds: [bandwidth, policy]
            preconditions:
              - scope: SHARED
                variable: signal_state
                value: tested
            effects:
              - scope: TOOL
                variable: bandwidth_state
                value: inspected
            optionProfile: policy_required
          - id: set_bandwidth
            role: set
            verbSeeds: [configure, throttle]
            nounSeeds: [bandwidth, rate]
            preconditions:
              - scope: TOOL
                variable: bandwidth_state
                value: inspected
            effects:
              - scope: TOOL
                variable: rate_state
                value: adjusted
              - scope: SHARED
                variable: wireless_profile_state
                value: ready
            optionProfile: profile_required
          - id: verify_bandwidth
            role: verify
            verbSeeds: [verify]
            nounSeeds: [bandwidth, service]
            preconditionTemplate: { rate_state: adjusted }
            effectTemplate: { policy_state: verified }
            optionProfile: confirm_required
    workflows:
      - id: debug_bandwidth_issue
        intent: Debug wireless bandwidth issues and verify throughput
        outcomePhrases: [bandwidth-adjusted with verified throughput, wireless throughput verified]
        steps:
          - toolId: tester
            capabilityId: test_signal
          - toolId: bandwidth_setter
            capabilityId: inspect_bandwidth
          - toolId: bandwidth_setter
            capabilityId: set_bandwidth
          - toolId: router
            capabilityId: inspect_router
          - toolId: router
            capabilityId: activate_radio
          - toolId: tester
            capabilityId: verify_throughput
      - id: setup_wireless_connectivity
        intent: Prepare wireless connectivity and verify client service
        outcomePhrases: [configured with connected client service, wireless service connected]
        steps:
          - toolId: wiring
            capabilityId: inspect_link
          - toolId: wiring
            capabilityId: repair_wiring
          - toolId: config_setup
            capabilityId: inspect_config
          - toolId: config_setup
            capabilityId: apply_config
          - toolId: router
            capabilityId: inspect_router
          - toolId: router
            capabilityId: activate_radio
          - toolId: tester
            capabilityId: test_signal
          - toolId: tester
            capabilityId: verify_connection

  - id: vpn_access_setup
    domain: NETWORK_INFRA
    purpose: remote access restoration, policy setup, and tunnel verification
    queryTemplates:
      - "Recover the remote access path so the final state is %s."
      - "Use the documented tools to bring the access workflow to a %s result."
    tools:
      - id: gateway
        purpose: gateway tunnel activation and peer readiness
        nameFragments: [gatecore, tunnelx, peergate]
        stateVariables: [gateway_state, tunnel_state, peer_state]
        fillerCommandRoles: [inspect gateway, configure tunnel, verify peer]
        capabilities:
          - id: inspect_gateway
            role: inspect
            verbSeeds: [inspect]
            nounSeeds: [gateway, peer]
            preconditions:
              - scope: SHARED
                variable: access_policy_state
                value: allowed
            effects:
              - scope: TOOL
                variable: gateway_state
                value: inspected
            optionProfile: path_required
          - id: restore_tunnel
            role: restore
            verbSeeds: [configure, tunnel]
            nounSeeds: [gateway, tunnel]
            preconditions:
              - scope: TOOL
                variable: gateway_state
                value: inspected
            effects:
              - scope: TOOL
                variable: tunnel_state
                value: restored
              - scope: SHARED
                variable: tunnel_state
                value: restored
            optionProfile: path_required
          - id: verify_peer
            role: verify
            verbSeeds: [verify]
            nounSeeds: [peer, service]
            preconditionTemplate: { tunnel_state: restored }
            effectTemplate: { peer_state: verified }
            optionProfile: confirm_required
      - id: policy_config
        purpose: access policy preparation and protected route setup
        nameFragments: [policyx, guardmesh, rulecore]
        stateVariables: [policy_state, access_state, protection_state]
        fillerCommandRoles: [inspect policy, configure rule, verify access]
        capabilities:
          - id: inspect_policy
            role: inspect
            verbSeeds: [inspect]
            nounSeeds: [policy, rule]
            preconditionTemplate: {}
            effectTemplate: { policy_state: inspected }
            optionProfile: policy_required
          - id: apply_access_rule
            role: apply
            verbSeeds: [configure, allow]
            nounSeeds: [policy, access]
            preconditions:
              - scope: TOOL
                variable: policy_state
                value: inspected
            effects:
              - scope: TOOL
                variable: access_state
                value: allowed
              - scope: SHARED
                variable: access_policy_state
                value: allowed
            optionProfile: policy_required
          - id: enable_protection
            role: protect
            verbSeeds: [enable]
            nounSeeds: [protection, firewall]
            preconditionTemplate: { access_state: allowed }
            effectTemplate: { protection_state: active }
            optionProfile: confirm_required
      - id: tunnel_tester
        purpose: tunnel probing and remote service verification
        nameFragments: [probevpn, testgate, remcheck]
        stateVariables: [probe_state, remote_state, service_state]
        fillerCommandRoles: [inspect tunnel, measure remote, verify service]
        capabilities:
          - id: probe_tunnel
            role: probe
            verbSeeds: [inspect, trace]
            nounSeeds: [tunnel, gateway]
            preconditions:
              - scope: SHARED
                variable: tunnel_state
                value: restored
            effects:
              - scope: TOOL
                variable: probe_state
                value: complete
            optionProfile: zone_required
          - id: verify_remote_service
            role: verify
            verbSeeds: [verify]
            nounSeeds: [remote, service]
            preconditions:
              - scope: TOOL
                variable: probe_state
                value: complete
              - scope: SHARED
                variable: tunnel_state
                value: restored
            effects:
              - scope: TOOL
                variable: remote_state
                value: verified
              - scope: SHARED
                variable: remote_service_state
                value: verified
            optionProfile: confirm_required
          - id: confirm_service
            role: confirm
            verbSeeds: [verify]
            nounSeeds: [service, client]
            preconditionTemplate: { remote_state: verified }
            effectTemplate: { service_state: confirmed }
            optionProfile: confirm_required
      - id: route_checker
        purpose: route path inspection and access route readiness
        nameFragments: [pathrtr, routecheck, uplcore]
        stateVariables: [route_state, uplink_state, readiness_state]
        fillerCommandRoles: [inspect route, synchronize uplink, verify path]
        capabilities:
          - id: inspect_route
            role: inspect
            verbSeeds: [inspect, route]
            nounSeeds: [route, uplink]
            preconditionTemplate: {}
            effectTemplate: { route_state: inspected }
            optionProfile: line_required
          - id: stabilize_route
            role: stabilize
            verbSeeds: [synchronize, configure]
            nounSeeds: [route, uplink]
            preconditions:
              - scope: TOOL
                variable: route_state
                value: inspected
            effects:
              - scope: TOOL
                variable: uplink_state
                value: synchronized
              - scope: SHARED
                variable: route_path_state
                value: synchronized
            optionProfile: path_required
          - id: verify_readiness
            role: verify
            verbSeeds: [verify]
            nounSeeds: [path, service]
            preconditions:
              - scope: TOOL
                variable: uplink_state
