spring:
  application:
    name: benchmark-llm-agent
  http:
    client:
      factory: jdk
  ai:
    retry:
      max-attempts: 5
      backoff:
        initial-interval: 2000
        multiplier: 2
        max-interval: 10000

benchmark:
  iterations: 5
  distractor-count: 11
  max-execution-steps: 7
  max-executions-per-attempt: 1
  max-repeated-command-failures-per-attempt: 1
  temperature: 0.0
  timeout-seconds: 720
  random-seed: 30
  domain: MANUFACTURING
  document-complexity: CLEAN
  trap-command: true
  llm:
    model: gpt-oss:20b-cloud
    base-url: http://127.0.0.1:11434
  prompt:
    base-system-prompt: |
      You are an autonomous benchmark agent.
      Follow the active phase instructions exactly.
      Never guess tool names, command names, options, preconditions, or effects.
      Use only values found in tool documentation or current state.
    attempt-guardrails: |
      Do not repeat a command that already failed in this attempt.
      Respect preconditions exactly.
      In the execution turn, use getCurrentState when you need to confirm a precondition before acting.
      While the goal is incomplete, each attempt must call executeCommand exactly once.
      The number of executeCommand calls must be at most {maxExecutionsPerAttempt}.
      The option argument is an exact flag string. When a command has no option, pass the empty string "".
      Reuse prior evidence when selecting the next safe command.
      If a command fails, inspect the state and choose the missing prerequisite instead of retrying blindly.
